<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mot de passe oublié — GRIOTTE</title>
<link rel="icon" type="image/png" href="./logo-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ══ TYPOGRAPHIE GRIOTTE ══════════════════════════════ */
body{font-family:'Inter',sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* Titres — Playfair uniquement */
h1,h2,.hero-title,.section-title,.auth-title,.card-title,.modal-cover-title,.carousel-title{
  font-family:'Playfair Display',serif;
  letter-spacing:-0.02em;
  line-height:1.12
}

/* Tout le reste — Inter */
h3,h4,h5,h6,p,span,a,button,input,select,textarea,label,li,td,th{
  font-family:'Inter',sans-serif
}

/* Hiérarchie des tailles */
h1,.hero-title{font-size:clamp(2.6rem,5vw,4.8rem);font-weight:800}
h2,.section-title{font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{font-size:1rem;line-height:1.75;color:#4A3F35}

/* Labels, badges, prix — DM Mono */
.section-badge,.hero-badge,.hero-label,.hero-stat-label,
.book-genre,.bc-genre,.lc-genre,
.book-price,.bc-price,.lc-price,
[class*="-label"],[class*="-badge"],
[class*="mono"],[class*="price"],[class*="stat-lbl"]{
  font-family:'DM Mono',monospace
}

/* Navigation */
.nav-links a,.nav-wordmark,.nav-logo-name,
.sidebar .nav-item,.filters .fbtn,.lc-filter{
  font-family:'Inter',sans-serif;
  font-size:0.875rem;
  letter-spacing:0.005em
}

/* Boutons */
button,.btn,.auth-btn,.btn-primary,.btn-hero-primary,.nbtn{
  font-family:'Inter',sans-serif;
  font-weight:600;
  letter-spacing:0.01em
}

/* Corps texte amélioré */
.hero-sub,.section-sub,.auth-sub,.perk-desc,.step-desc,.feature-desc{
  font-family:'Inter',sans-serif;
  font-size:1.05rem;
  font-weight:400;
  line-height:1.75;
  color:#4A3F35
}

/* Citations témoignages — Playfair italic */
.testi-quote,[class*="testi-quote"],
blockquote{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:1rem;
  line-height:1.75
}

/* Remplacer anciennes polices si présentes */
[style*="Cormorant"],[style*="Syne"]{font-family:'Playfair Display',serif!important}
/* ══ FIN TYPOGRAPHIE ══════════════════════════════════ */


*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;min-height:100vh;color:#1A1410;overflow-x:hidden}
:root{
 --or:#FF6B00;--or-dark:#CC5200;--or-glow:rgba(255,107,0,0.12);
 --bg:#F8F5F1;--card:#FFFFFF;
 --text:#1A1410;--soft:#4A3F35;--muted:#7A6A5E;
 --border:rgba(26,20,16,0.1);--shadow:0 4px 40px rgba(26,20,16,0.10)
}
/* Logo */
.logo{display:flex;flex-direction:column;align-items:center;gap:0.55rem}
.logo img{width:60px;height:60px;border-radius:16px;object-fit:contain}
.logo-name{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:800;color:var(--text);letter-spacing:-0.02em}
.logo-name span{color:var(--or)}
/* Card */
.card{background:var(--card);border-radius:24px;padding:2.75rem 2.5rem;box-shadow:var(--shadow);border:1px solid var(--border);width:100%;max-width:440px}
/* Fields */
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--soft);margin-bottom:0.4rem;letter-spacing:0.01em}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.8rem 1rem;font-family:'Inter',sans-serif;font-size:0.9rem;color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s;-webkit-appearance:none}
.field input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-glow)}
.field-pw{position:relative}
.field-pw input{padding-right:3rem}
.pw-eye{position:absolute;right:0.9rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:0.2rem;line-height:1;transition:color 0.2s}
.pw-eye:hover{color:var(--or)}
/* Buttons */
.btn{width:100%;padding:0.88rem 1rem;border-radius:12px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:0.6rem;border:none;text-decoration:none}
.btn-primary{background:var(--or);color:#fff;box-shadow:0 3px 16px rgba(255,107,0,0.28)}
.btn-primary:hover{background:var(--or-dark);transform:translateY(-1px);box-shadow:0 6px 24px rgba(255,107,0,0.32)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-google{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-google:hover{border-color:rgba(26,20,16,0.22);background:#fafafa}
.btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--or);color:var(--or)}
/* Divider */
.divider{display:flex;align-items:center;gap:0.75rem;margin:1.1rem 0;color:var(--muted);font-size:0.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* Error / success */
.msg-error{background:rgba(220,38,38,0.07);border:1px solid rgba(220,38,38,0.18);border-radius:9px;padding:0.65rem 0.9rem;font-size:0.82rem;color:#dc2626;margin-bottom:1rem;display:none;line-height:1.5}
.msg-error.on{display:block}
.msg-ok{background:rgba(22,163,74,0.07);border:1px solid rgba(22,163,74,0.18);border-radius:9px;padding:0.65rem 0.9rem;font-size:0.82rem;color:#15803d;margin-bottom:1rem;display:none;line-height:1.5}
.msg-ok.on{display:block}
/* Switch link */
.switch{text-align:center;font-size:0.84rem;color:var(--muted);margin-top:1.4rem}
.switch a{color:var(--or);font-weight:600;text-decoration:none}
.switch a:hover{text-decoration:underline}
/* Checkbox */
.check-row{display:flex;align-items:flex-start;gap:0.6rem;margin-bottom:0.85rem}
.check-row input[type=checkbox]{width:16px;height:16px;margin-top:2px;flex-shrink:0;accent-color:var(--or);cursor:pointer}
.check-row label{font-size:0.8rem;color:var(--soft);line-height:1.5;cursor:pointer}
.check-row a{color:var(--or);text-decoration:underline}

body{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;min-height:100vh}
</style>
</head>
<body>
<div class="card">
 <div class="logo" style="margin-bottom:1.75rem">
 <img src="./logo-icon.png" alt="GRIOTTE" onerror="this.style.display='none'"/>
 <div class="logo-name">Grio<span>tte</span></div>
 </div>

 <h1 style="font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:800;color:var(--text);margin-bottom:0.4rem;letter-spacing:-0.02em">Mot de passe oublié</h1>
 <p style="font-size:0.85rem;color:var(--muted);margin-bottom:1.75rem;line-height:1.6">Entrez votre adresse email. Si un compte existe, vous recevrez un lien de réinitialisation.</p>

 <div class="msg-error" id="fErr"></div>
 <div class="msg-ok" id="fOk">✓ Si un compte existe avec cet email, un lien de réinitialisation vous sera envoyé. Vérifiez votre boîte mail.</div>

 <form id="fForm" onsubmit="doForgot(event)" novalidate>
 <div class="field">
 <label for="fEmail">Adresse email</label>
 <input id="fEmail" type="email" placeholder="votre@email.com" autocomplete="off" required/>
 </div>
 <button class="btn btn-primary" type="submit" id="fBtn">Envoyer le lien de réinitialisation →</button>
 </form>

 <p class="switch" style="margin-top:1.25rem">
 <a href="./griotte-login.html">← Retour à la connexion</a>
 </p>
</div>
<script>
const API = 'https://griotte-backend-2-production.up.railway.app/api/v1';
async function doForgot(e) {
 e.preventDefault();
 document.getElementById('fErr').classList.remove('on');
 var email = document.getElementById('fEmail').value.trim();
 if (!email) { var el=document.getElementById('fErr'); el.textContent='Veuillez entrer votre email.'; el.classList.add('on'); return; }
 var btn = document.getElementById('fBtn');
 btn.textContent = 'Envoi…'; btn.disabled = true;
 try {
 await fetch(API + '/auth/forgot-password', {
 method:'POST', headers:{'Content-Type':'application/json'},
 body:JSON.stringify({email})
 });
 } catch(e) {}
 document.getElementById('fForm').style.display = 'none';
 document.getElementById('fOk').classList.add('on');
}
</script>
</body>
</html>
