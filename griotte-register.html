<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Inscription — GRIOTTE</title>
<link rel="icon" type="image/png" href="./logo-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:#F4F1ED;color:#1A1410;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
:root{--or:#FF6B00;--or-glow:rgba(255,107,0,0.1);--border:rgba(26,20,16,0.1);--muted:#8A7A6E}
.card{background:#fff;border-radius:20px;padding:2.75rem;width:100%;max-width:420px;box-shadow:0 4px 32px rgba(26,20,16,0.08);border:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:0.55rem;margin-bottom:2.25rem}
.logo img{width:32px;height:32px;border-radius:9px;object-fit:contain}
.logo-name{font-size:0.78rem;font-weight:700;color:#1A1410;letter-spacing:0.1em;text-transform:uppercase}
h1{font-family:'Inter',sans-serif;font-size:1.4rem;font-weight:600;color:#1A1410;letter-spacing:-0.02em;margin-bottom:0.4rem}
.sub{font-size:0.8rem;color:var(--muted);margin-bottom:2rem;line-height:1.55}
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.75rem;font-weight:600;color:#4A3F35;margin-bottom:0.4rem}
.field input{width:100%;background:#F8F5F1;border:1.5px solid var(--border);border-radius:10px;padding:0.82rem 1rem;font-family:'Inter',sans-serif;font-size:0.9rem;color:#1A1410;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.field input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-glow)}

.pw-wrap{position:relative;display:block}
.pw-wrap input{
  width:100%;background:#F8F5F1;
  border:1.5px solid rgba(26,20,16,0.1);
  border-radius:10px;
  padding:0.82rem 3rem 0.82rem 1rem;
  font-family:'Inter',sans-serif;font-size:0.9rem;
  color:#1A1410;outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
  -webkit-appearance:none;appearance:none;
  /* Force no browser autofill overlay */
  background-clip:padding-box
}
.pw-wrap input:focus{border-color:#FF6B00;box-shadow:0 0 0 3px rgba(255,107,0,0.1)}
.pw-eye{
  position:absolute;
  right:0;top:0;bottom:0;
  width:3rem;
  display:flex;align-items:center;justify-content:center;
  background:none;border:none;
  cursor:pointer;
  color:#9A8878;
  font-size:0.9rem;
  /* Critical: ensure button is on top */
  z-index:10;
  -webkit-tap-highlight-color:transparent;
  user-select:none
}
.pw-eye:hover{color:#FF6B00}
.pw-eye svg{pointer-events:none;display:block}

.check{display:flex;align-items:flex-start;gap:0.65rem;margin:1.25rem 0 1.5rem}
.check input[type=checkbox]{width:15px;height:15px;margin-top:2px;flex-shrink:0;accent-color:var(--or);cursor:pointer}
.check label{font-size:0.78rem;color:#4A3F35;line-height:1.55;cursor:pointer}
.check a{color:var(--or);text-decoration:none}
.btn{width:100%;padding:0.85rem;border-radius:10px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.9rem;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;border:none}
.btn-primary{background:#1A1410;color:#fff}
.btn-primary:hover{background:#2a1e15;transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.55;cursor:not-allowed;transform:none}
.msg-error{background:rgba(220,38,38,0.07);border:1px solid rgba(220,38,38,0.18);border-radius:9px;padding:0.65rem 0.9rem;font-size:0.82rem;color:#dc2626;margin-bottom:1rem;display:none;line-height:1.5}
.msg-error.on{display:block}
.back{text-align:center;font-size:0.78rem;color:var(--muted);margin-top:1.5rem}
.back a{color:var(--or);text-decoration:none}
@media(max-width:480px){body{padding:1.5rem 1rem;align-items:flex-start;padding-top:2rem}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="./logo-icon.png" alt="G" onerror="this.style.display='none'"/>
    <span class="logo-name">Griotte</span>
  </div>
  <h1>Créer mon compte</h1>
  <p class="sub">Lisez et publiez — un seul espace pour tout faire</p>
  <div class="msg-error" id="err"></div>
  <form id="form" onsubmit="doRegister(event)" novalidate autocomplete="off">
    <div class="field">
      <label for="name">Nom complet</label>
      <input id="name" type="text" placeholder="Votre nom complet" autocomplete="off" required/>
    </div>
    <div class="field">
      <label for="username">Nom d'utilisateur</label>
      <input id="username" type="text" placeholder="ex: ama_kouyate" autocomplete="off" required/>
    </div>
    <div class="field">
      <label for="dob">Date de naissance</label>
      <input id="dob" type="date" required/>
    </div>
    <div class="field">
      <label for="email">Adresse email</label>
      <input id="email" type="email" placeholder="votre@email.com" autocomplete="off" required/>
    </div>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <div class="pw-wrap">
        <input id="pw" type="password" placeholder="Minimum 8 caractères" autocomplete="off" required minlength="8"/>
        <button type="button" class="pw-eye" onclick="togglePw('pw',this)" aria-label="Afficher"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div class="field">
      <label for="pw2">Confirmer le mot de passe</label>
      <div class="pw-wrap">
        <input id="pw2" type="password" placeholder="Répétez votre mot de passe" autocomplete="off" required/>
        <button type="button" class="pw-eye" onclick="togglePw('pw2',this)" aria-label="Afficher"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div class="check">
      <input type="checkbox" id="cgu" required/>
      <label for="cgu">J'ai lu et accepté les <a href="#">Conditions d'utilisation</a> ainsi que la <a href="#">Politique de confidentialité</a> de GRIOTTE.</label>
    </div>
    <button class="btn btn-primary" type="submit" id="btn">Créer mon compte</button>
  </form>
  <p class="back"><a href="./griotte-welcome.html">← Retour</a></p>
</div>
<script>
const API='https://griotte-backend-2-production.up.railway.app/api/v1';

function togglePw(inputId, btn) {
  var inp = document.getElementById(inputId);
  if (!inp) return;
  var isHidden = inp.type === 'password';
  inp.type = isHidden ? 'text' : 'password';
  btn.innerHTML = isHidden
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  btn.setAttribute('aria-label', isHidden ? 'Masquer' : 'Afficher');
}

window.addEventListener('load',function(){
  setTimeout(function(){
    ['name','username','email','pw','pw2'].forEach(function(id){
      var el=document.getElementById(id);if(el)el.value='';
    });
  },100);
});
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.classList.add('on');e.scrollIntoView({behavior:'smooth',block:'nearest'});}
function clearErr(){document.getElementById('err').classList.remove('on');}
async function doRegister(e){
  e.preventDefault();clearErr();
  var name=document.getElementById('name').value.trim();
  var username=document.getElementById('username').value.trim();
  var dob=document.getElementById('dob').value;
  var email=document.getElementById('email').value.trim();
  var pw=document.getElementById('pw').value;
  var pw2=document.getElementById('pw2').value;
  var cgu=document.getElementById('cgu').checked;
  if(!name||!username||!dob||!email||!pw||!pw2){showErr('Veuillez remplir tous les champs.');return;}
  if(pw.length<8){showErr('Le mot de passe doit contenir au moins 8 caractères.');return;}
  if(pw!==pw2){showErr('Les mots de passe ne correspondent pas.');return;}
  if(!cgu){showErr('Vous devez accepter les conditions d'utilisation.');return;}
  var btn=document.getElementById('btn');
  btn.textContent='Création…';btn.disabled=true;
  try{
    var res=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,name,role:'READER'})});
    var data=await res.json();
    if(!res.ok){showErr(data.message||'Erreur lors de la création du compte.');btn.textContent='Créer mon compte';btn.disabled=false;return;}
    localStorage.setItem('griotte_token',data.accessToken);
    localStorage.setItem('griotte_role',data.role||'READER');
    localStorage.setItem('griotte_user',JSON.stringify({name,email,username,role:data.role}));
    window.location.href='./griotte-dashboard.html';
  }catch(err){showErr('Erreur réseau. Vérifiez votre connexion.');btn.textContent='Créer mon compte';btn.disabled=false;}
}
</script>
</body>
</html>
