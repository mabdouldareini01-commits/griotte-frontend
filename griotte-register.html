<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Inscription — GRIOTTE</title>
<link rel="icon" type="image/png" href="./logo-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;min-height:100vh;color:#1A1410;overflow-x:hidden}
:root{
  --or:#FF6B00;--or-dark:#CC5200;--or-glow:rgba(255,107,0,0.12);
  --bg:#F8F5F1;--card:#FFFFFF;
  --text:#1A1410;--soft:#4A3F35;--muted:#7A6A5E;
  --border:rgba(26,20,16,0.1);--shadow:0 4px 40px rgba(26,20,16,0.10)
}
/* Logo */
.logo{display:flex;flex-direction:column;align-items:center;gap:0.55rem}
.logo img{width:60px;height:60px;border-radius:16px;object-fit:contain}
.logo-name{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:800;color:var(--text);letter-spacing:-0.02em}
.logo-name span{color:var(--or)}
/* Card */
.card{background:var(--card);border-radius:24px;padding:2.75rem 2.5rem;box-shadow:var(--shadow);border:1px solid var(--border);width:100%;max-width:440px}
/* Fields */
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--soft);margin-bottom:0.4rem;letter-spacing:0.01em}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.8rem 1rem;font-family:'Inter',sans-serif;font-size:0.9rem;color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s;-webkit-appearance:none}
.field input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-glow)}
.field-pw{position:relative}
.field-pw input{padding-right:3rem}
.pw-eye{position:absolute;right:0.9rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:0.2rem;line-height:1;transition:color 0.2s}
.pw-eye:hover{color:var(--or)}
/* Buttons */
.btn{width:100%;padding:0.88rem 1rem;border-radius:12px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:0.6rem;border:none;text-decoration:none}
.btn-primary{background:var(--or);color:#fff;box-shadow:0 3px 16px rgba(255,107,0,0.28)}
.btn-primary:hover{background:var(--or-dark);transform:translateY(-1px);box-shadow:0 6px 24px rgba(255,107,0,0.32)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-google{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-google:hover{border-color:rgba(26,20,16,0.22);background:#fafafa}
.btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--or);color:var(--or)}
/* Divider */
.divider{display:flex;align-items:center;gap:0.75rem;margin:1.1rem 0;color:var(--muted);font-size:0.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* Error / success */
.msg-error{background:rgba(220,38,38,0.07);border:1px solid rgba(220,38,38,0.18);border-radius:9px;padding:0.65rem 0.9rem;font-size:0.82rem;color:#dc2626;margin-bottom:1rem;display:none;line-height:1.5}
.msg-error.on{display:block}
.msg-ok{background:rgba(22,163,74,0.07);border:1px solid rgba(22,163,74,0.18);border-radius:9px;padding:0.65rem 0.9rem;font-size:0.82rem;color:#15803d;margin-bottom:1rem;display:none;line-height:1.5}
.msg-ok.on{display:block}
/* Switch link */
.switch{text-align:center;font-size:0.84rem;color:var(--muted);margin-top:1.4rem}
.switch a{color:var(--or);font-weight:600;text-decoration:none}
.switch a:hover{text-decoration:underline}
/* Checkbox */
.check-row{display:flex;align-items:flex-start;gap:0.6rem;margin-bottom:0.85rem}
.check-row input[type=checkbox]{width:16px;height:16px;margin-top:2px;flex-shrink:0;accent-color:var(--or);cursor:pointer}
.check-row label{font-size:0.8rem;color:var(--soft);line-height:1.5;cursor:pointer}
.check-row a{color:var(--or);text-decoration:underline}

body{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;min-height:100vh}
@media(max-width:480px){body{padding:1.5rem 1rem;align-items:flex-start}}
</style>
</head>
<body>
<div class="card">
  <!-- Logo -->
  <div class="logo" style="margin-bottom:1.75rem">
    <img src="./logo-icon.png" alt="GRIOTTE" onerror="this.style.display='none'"/>
    <div class="logo-name">Grio<span>tte</span></div>
  </div>

  <h1 style="font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:800;color:var(--text);margin-bottom:0.4rem;letter-spacing:-0.02em">Créer mon compte</h1>
  <p style="font-size:0.85rem;color:var(--muted);margin-bottom:1.75rem">Lisez et publiez — un seul compte pour tout faire</p>

  <div class="msg-error" id="regErr"></div>

  <form id="regForm" onsubmit="doRegister(event)" novalidate autocomplete="off">
    <div class="field">
      <label for="regName">Nom complet</label>
      <input id="regName" type="text" placeholder="Votre nom complet" autocomplete="off" required/>
    </div>
    <div class="field">
      <label for="regUsername">Nom d'utilisateur</label>
      <input id="regUsername" type="text" placeholder="ex: ama_kouyate" autocomplete="off" required/>
    </div>
    <div class="field">
      <label for="regDob">Date de naissance</label>
      <input id="regDob" type="date" required/>
    </div>
    <div class="field">
      <label for="regEmail">Adresse email</label>
      <input id="regEmail" type="email" placeholder="votre@email.com" autocomplete="off" required/>
    </div>
    <div class="field">
      <label for="regPw">Mot de passe</label>
      <div class="field-pw">
        <input id="regPw" type="password" placeholder="Minimum 8 caractères" autocomplete="off" required minlength="8"/>
        <button type="button" class="pw-eye" onclick="togglePw('regPw',this)">👁</button>
      </div>
    </div>
    <div class="field" style="margin-bottom:1.25rem">
      <label for="regConfirm">Confirmer le mot de passe</label>
      <div class="field-pw">
        <input id="regConfirm" type="password" placeholder="Répétez votre mot de passe" autocomplete="off" required/>
        <button type="button" class="pw-eye" onclick="togglePw('regConfirm',this)">👁</button>
      </div>
    </div>

    <div class="check-row" style="margin-bottom:1.5rem">
      <input type="checkbox" id="chkAll" required/>
      <label for="chkAll">J'ai lu et accepté les <a href="#">Conditions d'utilisation</a> ainsi que la <a href="#">Politique de confidentialité</a> de GRIOTTE.</label>
    </div>

    <button class="btn btn-primary" type="submit" id="regBtn">Créer mon compte →</button>
  </form>

  <p style="text-align:center;margin-top:1.25rem;font-size:0.8rem;color:#7A6A5E">
    <a href="./griotte-welcome.html" style="color:#FF6B00;text-decoration:none">← Retour</a>
  </p>

</div>

<script>
const API = 'https://griotte-backend-2-production.up.railway.app/api/v1';

window.addEventListener('load', function() {
  setTimeout(function() {
    document.querySelectorAll('#regForm input[type=text],#regForm input[type=email],#regForm input[type=password]')
      .forEach(function(f) { f.value = ''; });
  }, 150);
});

function togglePw(id, btn) {
  var inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}

function showErr(msg) {
  var el = document.getElementById('regErr');
  el.textContent = msg; el.classList.add('on');
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function clearErr() { document.getElementById('regErr').classList.remove('on'); }

async function doRegister(e) {
  e.preventDefault();
  clearErr();

  var name     = document.getElementById('regName').value.trim();
  var username = document.getElementById('regUsername').value.trim();
  var dob      = document.getElementById('regDob').value;
  var email    = document.getElementById('regEmail').value.trim();
  var pw       = document.getElementById('regPw').value;
  var confirm  = document.getElementById('regConfirm').value;
  var chkAll   = document.getElementById('chkAll').checked;

  if (!name || !username || !dob || !email || !pw || !confirm) {
    showErr('Veuillez remplir tous les champs.'); return;
  }
  if (pw.length < 8) {
    showErr('Le mot de passe doit contenir au moins 8 caractères.'); return;
  }
  if (pw !== confirm) {
    showErr('Les mots de passe ne correspondent pas.'); return;
  }
  if (!chkAll) {
    showErr('Vous devez accepter les conditions d'utilisation et la politique de confidentialité.'); return;
  }

  var btn = document.getElementById('regBtn');
  btn.textContent = 'Création en cours…'; btn.disabled = true;

  try {
    var res  = await fetch(API + '/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email, password: pw, name, role: 'READER' })
    });
    var data = await res.json();

    if (!res.ok) {
      showErr(data.message || 'Erreur lors de la création du compte.');
      btn.textContent = 'Créer mon compte →'; btn.disabled = false;
      return;
    }

    localStorage.setItem('griotte_token', data.accessToken);
    localStorage.setItem('griotte_role',  data.role || 'READER');
    localStorage.setItem('griotte_user',  JSON.stringify({ name, email, username, role: data.role }));
    window.location.href = './griotte-dashboard.html';

  } catch(err) {
    showErr('Erreur réseau. Vérifiez votre connexion et réessayez.');
    btn.textContent = 'Créer mon compte →'; btn.disabled = false;
  }
}
</script>
</body>
</html>
