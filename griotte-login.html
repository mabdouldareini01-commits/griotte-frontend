<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Connexion — GRIOTTE</title>
<link rel="icon" type="image/png" href="./logo-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;min-height:100vh;color:#1A1410;overflow-x:hidden}
:root{
  --or:#FF6B00;--or-dark:#CC5200;--or-glow:rgba(255,107,0,0.12);
  --bg:#F8F5F1;--card:#FFFFFF;
  --text:#1A1410;--soft:#4A3F35;--muted:#7A6A5E;
  --border:rgba(26,20,16,0.1);--shadow:0 4px 40px rgba(26,20,16,0.10)
}
/* Logo */
.logo{display:flex;flex-direction:column;align-items:center;gap:0.55rem}
.logo img{width:60px;height:60px;border-radius:16px;object-fit:contain}
.logo-name{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:800;color:var(--text);letter-spacing:-0.02em}
.logo-name span{color:var(--or)}
/* Card */
.card{background:var(--card);border-radius:24px;padding:2.75rem 2.5rem;box-shadow:var(--shadow);border:1px solid var(--border);width:100%;max-width:440px}
/* Fields */
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.78rem;font-weight:600;color:var(--soft);margin-bottom:0.4rem;letter-spacing:0.01em}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0.8rem 1rem;font-family:'Inter',sans-serif;font-size:0.9rem;color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s;-webkit-appearance:none}
.field input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-glow)}
.field-pw{position:relative}
.field-pw input{padding-right:3rem}
.pw-eye{position:absolute;right:0.9rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:0.2rem;line-height:1;transition:color 0.2s}
.pw-eye:hover{color:var(--or)}
/* Buttons */
.btn{width:100%;padding:0.88rem 1rem;border-radius:12px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.95rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:0.6rem;border:none;text-decoration:none}
.btn-primary{background:var(--or);color:#fff;box-shadow:0 3px 16px rgba(255,107,0,0.28)}
.btn-primary:hover{background:var(--or-dark);transform:translateY(-1px);box-shadow:0 6px 24px rgba(255,107,0,0.32)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-google{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-google:hover{border-color:rgba(26,20,16,0.22);background:#fafafa}
.btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--or);color:var(--or)}
/* Divider */
.divider{display:flex;align-items:center;gap:0.75rem;margin:1.1rem 0;color:var(--muted);font-size:0.75rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* Error / success */
.msg-error{background:rgba(220,38,38,0.07);border:1px solid rgba(220,38,38,0.18);border-radius:9px;padding:0.65rem 0.9rem;font-size:0.82rem;color:#dc2626;margin-bottom:1rem;display:none;line-height:1.5}
.msg-error.on{display:block}
.msg-ok{background:rgba(22,163,74,0.07);border:1px solid rgba(22,163,74,0.18);border-radius:9px;padding:0.65rem 0.9rem;font-size:0.82rem;color:#15803d;margin-bottom:1rem;display:none;line-height:1.5}
.msg-ok.on{display:block}
/* Switch link */
.switch{text-align:center;font-size:0.84rem;color:var(--muted);margin-top:1.4rem}
.switch a{color:var(--or);font-weight:600;text-decoration:none}
.switch a:hover{text-decoration:underline}
/* Checkbox */
.check-row{display:flex;align-items:flex-start;gap:0.6rem;margin-bottom:0.85rem}
.check-row input[type=checkbox]{width:16px;height:16px;margin-top:2px;flex-shrink:0;accent-color:var(--or);cursor:pointer}
.check-row label{font-size:0.8rem;color:var(--soft);line-height:1.5;cursor:pointer}
.check-row a{color:var(--or);text-decoration:underline}

body{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:2rem 1rem;min-height:100vh}
@media(max-width:480px){body{padding:1.5rem 1rem;align-items:flex-start}}
</style>
</head>
<body>
<div class="card">
  <div class="logo" style="margin-bottom:1.75rem">
    <img src="./logo-icon.png" alt="GRIOTTE" onerror="this.style.display='none'"/>
    <div class="logo-name">Grio<span>tte</span></div>
  </div>

  <h1 style="font-family:'Playfair Display',serif;font-size:1.55rem;font-weight:800;color:var(--text);margin-bottom:0.4rem;letter-spacing:-0.02em">Bon retour sur GRIOTTE</h1>
  <p style="font-size:0.85rem;color:var(--muted);margin-bottom:1.75rem">Connectez-vous pour reprendre votre lecture</p>

  <div class="msg-error" id="loginErr"></div>

  <form id="loginForm" onsubmit="doLogin(event)" novalidate autocomplete="off">
    <div class="field">
      <label for="loginEmail">Adresse email</label>
      <input id="loginEmail" type="email" placeholder="votre@email.com" autocomplete="off" required/>
    </div>
    <div class="field">
      <label for="loginPw">Mot de passe</label>
      <div class="field-pw">
        <input id="loginPw" type="password" placeholder="••••••••" autocomplete="off" required/>
        <button type="button" class="pw-eye" onclick="togglePw('loginPw',this)">👁</button>
      </div>
    </div>
    <div style="text-align:right;margin-bottom:1.25rem;margin-top:-0.25rem">
      <a href="./griotte-forgot-password.html" style="font-size:0.78rem;color:var(--or);text-decoration:none">
        Mot de passe oublié ?
      </a>
    </div>
    <button class="btn btn-primary" type="submit" id="loginBtn">Se connecter →</button>
  </form>

  <div class="divider">ou</div>
  <button class="btn btn-google" onclick="window.location.href='https://griotte-backend-2-production.up.railway.app/api/v1/auth/google'">
    <svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continuer avec Google
  </button>

  <p class="switch">Pas encore de compte ? <a href="./griotte-register.html">S'inscrire</a></p>
</div>

<script>
const API = 'https://griotte-backend-2-production.up.railway.app/api/v1';

// Token depuis URL (retour Google OAuth)
var urlToken = new URLSearchParams(window.location.search).get('token');
if (urlToken) {
  localStorage.setItem('griotte_token', urlToken);
  window.history.replaceState({}, '', window.location.pathname);
  fetch(API + '/auth/me', {headers:{'Authorization':'Bearer '+urlToken}})
    .then(r=>r.json()).then(me=>{
      localStorage.setItem('griotte_user', JSON.stringify(me));
      localStorage.setItem('griotte_role', me.role||'READER');
      redirectByRole(me.role);
    }).catch(()=>redirectByRole('READER'));
}

window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPw').value = '';
  }, 150);
});

function redirectByRole(role) {
  window.location.href = role === 'ADMIN' ? './griotte-admin.html' : './griotte-dashboard.html';
}
function togglePw(id, btn) {
  var inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁' : '🙈';
}
function showErr(msg) {
  var el = document.getElementById('loginErr');
  el.textContent = msg; el.classList.add('on');
}
function clearErr() { document.getElementById('loginErr').classList.remove('on'); }

async function doLogin(e) {
  e.preventDefault();
  clearErr();
  var email = document.getElementById('loginEmail').value.trim();
  var pw    = document.getElementById('loginPw').value;
  if (!email || !pw) { showErr('Veuillez remplir tous les champs.'); return; }

  var btn = document.getElementById('loginBtn');
  btn.textContent = 'Connexion…'; btn.disabled = true;

  try {
    var res  = await fetch(API + '/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password:pw})
    });
    var data = await res.json();

    if (!res.ok) {
      showErr(data.message || 'Email ou mot de passe incorrect.');
      btn.textContent = 'Se connecter →'; btn.disabled = false;
      return;
    }

    localStorage.setItem('griotte_token', data.accessToken);
    localStorage.setItem('griotte_role',  data.role||'READER');

    try {
      var me = await (await fetch(API+'/auth/me',{
        headers:{'Authorization':'Bearer '+data.accessToken}
      })).json();
      localStorage.setItem('griotte_user', JSON.stringify(me));
    } catch(e2){}

    redirectByRole(data.role);
  } catch(err) {
    showErr('Erreur réseau. Vérifiez votre connexion.');
    btn.textContent = 'Se connecter →'; btn.disabled = false;
  }
}
</script>
</body>
</html>
