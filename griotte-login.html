<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Connexion — GRIOTTE</title>
<link rel="icon" type="image/png" href="./logo-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:#F4F1ED;color:#1A1410;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem}
:root{--or:#FF6B00;--or-glow:rgba(255,107,0,0.1);--border:rgba(26,20,16,0.1);--muted:#8A7A6E}
.card{background:#fff;border-radius:20px;padding:2.75rem;width:100%;max-width:380px;box-shadow:0 4px 32px rgba(26,20,16,0.08);border:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:0.55rem;margin-bottom:2.25rem}
.logo img{width:32px;height:32px;border-radius:9px;object-fit:contain}
.logo-name{font-size:0.78rem;font-weight:700;color:#1A1410;letter-spacing:0.1em;text-transform:uppercase}
h1{font-family:'Inter',sans-serif;font-size:1.4rem;font-weight:600;color:#1A1410;letter-spacing:-0.02em;margin-bottom:0.4rem}
.sub{font-size:0.8rem;color:var(--muted);margin-bottom:2rem;line-height:1.55}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:0.75rem;font-weight:600;color:#4A3F35;margin-bottom:0.4rem;letter-spacing:0.01em}
.field input{width:100%;background:#F8F5F1;border:1.5px solid var(--border);border-radius:10px;padding:0.82rem 1rem;font-family:'Inter',sans-serif;font-size:0.9rem;color:#1A1410;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.field input:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-glow)}

.pw-wrap{position:relative;display:block}
.pw-wrap input{width:100%;background:#F8F5F1;border:1.5px solid rgba(26,20,16,0.1);border-radius:10px;padding:0.82rem 3rem 0.82rem 1rem;font-family:'Inter',sans-serif;font-size:0.9rem;color:#1A1410;outline:none;transition:border-color 0.2s,box-shadow 0.2s;box-sizing:border-box;-webkit-appearance:none}
.pw-wrap input:focus{border-color:#FF6B00;box-shadow:0 0 0 3px rgba(255,107,0,0.1)}
.pw-eye svg{pointer-events:none;display:block}

.forgot{display:block;text-align:right;font-size:0.75rem;color:var(--or);text-decoration:none;margin-top:-0.4rem;margin-bottom:1.25rem}
.forgot:hover{text-decoration:underline}
.btn{width:100%;padding:0.85rem;border-radius:10px;font-family:'Inter',sans-serif;font-weight:600;font-size:0.9rem;cursor:pointer;transition:all 0.18s;display:flex;align-items:center;justify-content:center;gap:0.6rem;border:none}
.btn-primary{background:#1A1410;color:#fff;margin-bottom:0.75rem}
.btn-primary:hover{background:#2a1e15;transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.55;cursor:not-allowed;transform:none}
.btn-google{background:#fff;color:#1A1410;border:1.5px solid var(--border)}
.btn-google:hover{border-color:rgba(26,20,16,0.2)}
.sep{display:flex;align-items:center;gap:0.6rem;margin:1rem 0;color:var(--muted);font-size:0.72rem}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--border)}
.msg-error{background:rgba(220,38,38,0.07);border:1px solid rgba(220,38,38,0.18);border-radius:9px;padding:0.65rem 0.9rem;font-size:0.82rem;color:#dc2626;margin-bottom:1rem;display:none;line-height:1.5}
.msg-error.on{display:block}
.switch{text-align:center;font-size:0.8rem;color:var(--muted);margin-top:1.5rem}
.switch a{color:var(--or);font-weight:600;text-decoration:none}
@media(max-width:480px){body{padding:1.5rem 1rem;align-items:flex-start;padding-top:2.5rem}}

@media(max-width:480px){
  body{padding:1rem!important;align-items:flex-start!important;padding-top:2rem!important}
  .card{padding:1.75rem 1.25rem!important;border-radius:16px!important}
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="./logo-icon.png" alt="G" onerror="this.style.display='none'"/>
    <span class="logo-name">Griotte</span>
  </div>
  <h1>Bon retour</h1>
  <p class="sub">Connectez-vous pour reprendre votre lecture</p>
  <div class="msg-error" id="err"></div>
  <form id="form" onsubmit="doLogin(event)" novalidate autocomplete="off">
    <div class="field">
      <label for="email">Adresse email</label>
      <input id="email" type="email" placeholder="votre@email.com" autocomplete="off" required/>
    </div>
    <div class="field">
      <label for="pw">Mot de passe</label>
      <div class="pw-wrap">
        <input id="pw" type="password" placeholder="••••••••" autocomplete="off" required/>
        <button
        type="button"
        id="eye_pw"
        onclick="var i=document.getElementById('pw');i.type=i.type==='password'?'text':'password';this.setAttribute('data-v',i.type==='text'?'1':'0')"
        data-v="0"
        style="position:absolute;right:0.85rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0.3rem;line-height:0;z-index:9"
        aria-label="Afficher le mot de passe"
      ><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A8878" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" id="eye_pw_svg"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <a href="./griotte-forgot-password.html" class="forgot">Mot de passe oublié ?</a>
    <button class="btn btn-primary" type="submit" id="btn">Se connecter</button>
  </form>
  <div class="sep">ou</div>
  <button class="btn btn-google" onclick="window.location.href='https://griotte-backend-2-production.up.railway.app/api/v1/auth/google'"><svg width="18" height="18" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continuer avec Google</button>
  <p class="switch">Pas de compte ? <a href="./griotte-register.html">S'inscrire</a></p>
</div>
<script>
const API='https://griotte-backend-2-production.up.railway.app/api/v1';



window.addEventListener('load',function(){
  setTimeout(function(){
    document.getElementById('email').value='';
    document.getElementById('pw').value='';
  },100);
});
var urlToken=new URLSearchParams(window.location.search).get('token');
if(urlToken){
  localStorage.setItem('griotte_token',urlToken);
  window.history.replaceState({},'',window.location.pathname);
  fetch(API+'/auth/me',{headers:{'Authorization':'Bearer '+urlToken}})
    .then(r=>r.json()).then(me=>{
      localStorage.setItem('griotte_user',JSON.stringify(me));
      localStorage.setItem('griotte_role',me.role||'READER');
      window.location.href=me.role==='ADMIN'?'./griotte-admin.html':'./griotte-dashboard.html';
    }).catch(()=>{window.location.href='./griotte-dashboard.html';});
}
function showErr(m){var e=document.getElementById('err');e.textContent=m;e.classList.add('on');}
function clearErr(){document.getElementById('err').classList.remove('on');}
async function doLogin(e){
  e.preventDefault();clearErr();
  var email=document.getElementById('email').value.trim();
  var pw=document.getElementById('pw').value;
  if(!email||!pw){showErr('Veuillez remplir tous les champs.');return;}
  var btn=document.getElementById('btn');
  btn.textContent='Connexion…';btn.disabled=true;
  try{
    var res=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    var data=await res.json();
    if(!res.ok){showErr(data.message||'Email ou mot de passe incorrect.');btn.textContent='Se connecter';btn.disabled=false;return;}
    localStorage.setItem('griotte_token',data.accessToken);
    localStorage.setItem('griotte_role',data.role||'READER');
    try{var me=await(await fetch(API+'/auth/me',{headers:{'Authorization':'Bearer '+data.accessToken}})).json();localStorage.setItem('griotte_user',JSON.stringify(me));}catch(e2){}
    window.location.href=data.role==='ADMIN'?'./griotte-admin.html':'./griotte-dashboard.html';
  }catch(err){showErr('Erreur réseau. Vérifiez votre connexion.');btn.textContent='Se connecter';btn.disabled=false;}
}
</script>
</body>
</html>
