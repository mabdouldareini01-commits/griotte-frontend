<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GRIOTTE — Catalogue</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
/* ── LOGO GRIOTTE UNIQUE ─────────────────────────────────── */
.g-icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:0;overflow:visible}
.g-icon img{display:block;object-fit:contain;border-radius:16px;overflow:visible}
.g-icon--48 img{height:48px;width:48px}
.g-icon--40 img{height:40px;width:40px}
.g-icon--36 img{height:36px;width:36px}
.g-icon--32 img{height:32px;width:32px}
[class*="logo"],[class*="sidebar-logo"],[class*="cat-logo"],[class*="s-logo"],[class*="footer-logo"]{overflow:visible!important}
@media(max-width:768px){
  .g-icon--48 img,.g-icon--40 img{height:36px;width:36px}
  .g-icon--36 img,.g-icon--32 img{height:32px;width:32px}
}
/* ──────────────────────────────────────────────────────── */

:root{--noir:#080604;--noir-soft:#0f0d0a;--noir-card:#141210;--or:#D9902D;--or-dark:#b8751f;--or-glow:rgba(217,144,45,0.1);--blanc:#F8F6F2;--blanc-dim:#a09890;--cendre:#6b6157;--border:rgba(248,246,242,0.06);--border-or:rgba(217,144,45,0.2);--green:#4ade80;--sidebar-w:280px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--noir);color:var(--blanc);font-family:'Syne',sans-serif;min-height:100vh;display:flex}
::selection{background:rgba(217,144,45,0.25)}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(217,144,45,0.3);border-radius:2px}

/* SIDEBAR */
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--noir-soft);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-top{padding:1.4rem 1.5rem;border-bottom:1px solid var(--border)}
.back-link{display:flex;align-items:center;gap:0.5rem;font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--cendre);text-decoration:none;margin-bottom:1.4rem;transition:color 0.2s}
.back-link:hover{color:var(--blanc)}
.cat-logo{display:flex;align-items:center;gap:0.6rem}
.logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--or),var(--or-dark));border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:0.85rem;color:var(--noir)}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:0.95rem;color:var(--blanc);letter-spacing:0.06em;text-transform:uppercase}
.logo-text span{color:var(--or)}

.filter-block{padding:1.1rem 1.5rem;border-bottom:1px solid var(--border)}
.filter-title{font-family:'DM Mono',monospace;font-size:0.56rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--cendre);margin-bottom:0.75rem;display:flex;justify-content:space-between;align-items:center}
.filter-clear{color:var(--or);cursor:pointer;font-size:0.72rem;transition:opacity 0.2s}
.filter-clear:hover{opacity:0.7}

.genre-chips{display:flex;flex-wrap:wrap;gap:0.35rem}
.chip{font-family:'DM Mono',monospace;font-size:0.56rem;letter-spacing:0.05em;padding:0.28rem 0.62rem;border:1px solid var(--border);border-radius:100px;cursor:pointer;transition:all 0.2s;color:var(--cendre);background:none;user-select:none}
.chip:hover{color:var(--blanc);border-color:rgba(248,246,242,0.2)}
.chip.active{color:var(--or);border-color:var(--border-or);background:var(--or-glow)}

.country-list{display:flex;flex-direction:column;gap:0.25rem}
.country-item{display:flex;align-items:center;gap:0.55rem;padding:0.38rem 0.5rem;border-radius:6px;cursor:pointer;transition:all 0.2s;font-size:0.72rem;color:var(--cendre)}
.country-item:hover{background:rgba(248,246,242,0.04);color:var(--blanc)}
.country-item.active{color:var(--or);background:var(--or-glow)}
.country-count{margin-left:auto;font-family:'DM Mono',monospace;font-size:0.72rem;color:rgba(107,97,87,0.45)}

.sort-select{width:100%;background:rgba(248,246,242,0.03);border:1px solid var(--border);border-radius:8px;padding:0.62rem 0.9rem;font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--cendre);outline:none;cursor:pointer}
.sort-select option{background:var(--noir-card)}

.rating-opt{display:flex;align-items:center;gap:0.5rem;cursor:pointer;padding:0.32rem 0.5rem;border-radius:6px;transition:background 0.2s}
.rating-opt:hover{background:rgba(248,246,242,0.04)}
.rating-opt.active{background:var(--or-glow)}
.rating-stars{color:var(--or);font-size:0.72rem}
.rating-label{font-family:'DM Mono',monospace;font-size:0.56rem;color:var(--cendre)}
.rating-opt.active .rating-label{color:var(--or)}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:58px;background:rgba(8,6,4,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:1.2rem}
.cat-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;color:var(--blanc)}
.results-count{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--cendre)}
.search-wrap{position:relative;flex:1;max-width:380px}
.search-input{width:100%;background:rgba(248,246,242,0.04);border:1px solid var(--border);border-radius:100px;padding:0.52rem 1rem 0.52rem 2rem;font-family:'DM Mono',monospace;font-size:0.66rem;color:var(--blanc);outline:none;transition:all 0.2s}
.search-input:focus{border-color:var(--border-or)}
.search-input::placeholder{color:var(--cendre)}
.search-ico{position:absolute;left:0.72rem;top:50%;transform:translateY(-50%);color:var(--cendre);font-size:0.78rem;pointer-events:none}
.view-toggle{display:flex;gap:0.25rem}
.view-btn{width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:none;color:var(--cendre);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.78rem;transition:all 0.2s}
.view-btn:hover{color:var(--blanc)}
.view-btn.active{color:var(--or);border-color:var(--border-or);background:var(--or-glow)}

/* CONTENT */
.content{padding:2rem;flex:1}

/* LOADING */
.loading-state{text-align:center;padding:5rem 2rem}
.loading-ico{font-size:3rem;margin-bottom:1rem;opacity:0.3;animation:spin 2s linear infinite;display:block}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.loading-text{font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--cendre)}

/* EMPTY */
.empty-state{text-align:center;padding:5rem 2rem}
.empty-ico{font-size:3.5rem;margin-bottom:1rem;opacity:0.3;display:block}
.empty-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--blanc-dim);margin-bottom:0.5rem}
.empty-sub{font-family:'DM Mono',monospace;font-size:0.65rem;color:var(--cendre);line-height:1.7}

/* GRID */
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:1.4rem;margin-bottom:2rem}
.books-grid.list-view{grid-template-columns:1fr;gap:0.7rem}

/* GRID CARD */
.book-card{cursor:pointer;transition:transform 0.25s;position:relative}
.book-card:hover{transform:translateY(-5px)}
.book-cover{aspect-ratio:2/3;border-radius:4px 12px 12px 4px;margin-bottom:0.8rem;position:relative;overflow:hidden;box-shadow:-5px 0 0 rgba(0,0,0,0.3),0 14px 40px rgba(0,0,0,0.4);transition:box-shadow 0.25s}
.book-card:hover .book-cover{box-shadow:-5px 0 0 rgba(0,0,0,0.3),0 20px 60px rgba(0,0,0,0.55)}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-cover-placeholder{width:100%;height:100%;display:flex;align-items:flex-end;padding:0.65rem;position:relative}
.book-cover-placeholder::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.72))}
.book-badge{position:absolute;top:0.55rem;left:0.55rem;z-index:1;font-family:'DM Mono',monospace;font-size:0.48rem;letter-spacing:0.08em;text-transform:uppercase;padding:0.12rem 0.38rem;border-radius:100px}
.badge-new{background:rgba(74,222,128,0.2);color:#4ade80}
.badge-trending{background:rgba(217,144,45,0.2);color:var(--or)}
.badge-top{background:rgba(248,113,113,0.2);color:#f87171}
.book-pages-cover{position:absolute;bottom:0.55rem;right:0.55rem;z-index:1;font-family:'DM Mono',monospace;font-size:0.72rem;color:rgba(255,255,255,0.5)}
.book-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,6,4,0.72);opacity:0;transition:opacity 0.25s;border-radius:4px 12px 12px 4px}
.book-card:hover .book-overlay{opacity:1}
.book-overlay-btn{background:linear-gradient(135deg,var(--or),var(--or-dark));color:var(--noir);font-family:'Syne',sans-serif;font-weight:700;font-size:0.7rem;padding:0.52rem 1.1rem;border:none;border-radius:100px;cursor:pointer;transform:translateY(4px);transition:transform 0.25s}
.book-card:hover .book-overlay-btn{transform:translateY(0)}
.book-title-cat{font-family:'Cormorant Garamond',serif;font-size:0.92rem;font-weight:600;color:var(--blanc);line-height:1.2;margin-bottom:0.22rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.book-author-cat{font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--cendre);margin-bottom:0.28rem}
.book-meta-row{display:flex;align-items:center;justify-content:space-between}
.book-rating-cat{font-family:'DM Mono',monospace;font-size:0.56rem;color:var(--or)}
.book-price{font-family:'DM Mono',monospace;font-size:0.54rem;color:var(--cendre)}

/* LIST CARD */
.book-card-list{display:flex;gap:1.1rem;background:var(--noir-card);border:1px solid var(--border);border-radius:11px;padding:1.1rem;cursor:pointer;transition:border-color 0.2s}
.book-card-list:hover{border-color:var(--border-or)}
.list-cover{width:65px;height:95px;border-radius:3px 9px 9px 3px;flex-shrink:0;box-shadow:-4px 0 0 rgba(0,0,0,0.3);overflow:hidden;position:relative}
.list-cover img{width:100%;height:100%;object-fit:cover}
.list-cover-ph{width:100%;height:100%}
.list-info{flex:1;min-width:0}
.list-title{font-family:'Cormorant Garamond',serif;font-size:1.02rem;font-weight:600;color:var(--blanc);margin-bottom:0.22rem;line-height:1.2}
.list-author{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--cendre);margin-bottom:0.45rem}
.list-synopsis{font-family:'Cormorant Garamond',serif;font-size:0.85rem;color:var(--blanc-dim);line-height:1.5;margin-bottom:0.65rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;font-style:italic}
.list-tags{display:flex;gap:0.35rem;flex-wrap:wrap}
.list-tag{font-family:'DM Mono',monospace;font-size:0.72rem;letter-spacing:0.05em;padding:0.15rem 0.45rem;border-radius:100px;border:1px solid var(--border);color:var(--cendre)}
.list-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex-shrink:0;min-width:75px}
.list-rating{font-family:'DM Mono',monospace;font-size:0.62rem;color:var(--or);margin-bottom:0.25rem}
.list-pages{font-family:'DM Mono',monospace;font-size:0.56rem;color:var(--cendre);margin-bottom:auto}
.list-read-btn{background:linear-gradient(135deg,var(--or),var(--or-dark));color:var(--noir);font-family:'Syne',sans-serif;font-weight:700;font-size:0.65rem;padding:0.48rem 0.9rem;border:none;border-radius:100px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.list-read-btn:hover{filter:brightness(1.1)}

/* LOAD MORE */
.load-more-btn{width:100%;padding:0.92rem;background:none;border:1px solid var(--border);border-radius:10px;color:var(--cendre);font-family:'DM Mono',monospace;font-size:0.66rem;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 0.2s}
.load-more-btn:hover{border-color:var(--border-or);color:var(--or);background:var(--or-glow)}

/* COVER COLORS */
.cv-1{background:linear-gradient(160deg,#2d1b0e,#8B4513)}.cv-2{background:linear-gradient(160deg,#0a1628,#2e5f8f)}.cv-3{background:linear-gradient(160deg,#1a2a0a,#5f8f2e)}.cv-4{background:linear-gradient(160deg,#280a0a,#8f2e2e)}.cv-5{background:linear-gradient(160deg,#0a1a28,#0e5a8f)}.cv-6{background:linear-gradient(160deg,#1a0a28,#5a1e8f)}.cv-7{background:linear-gradient(160deg,#281a0a,#8f5a1e)}.cv-8{background:linear-gradient(160deg,#0a2828,#1e7a7a)}.cv-9{background:linear-gradient(160deg,#1e1a0a,#7a6e1e)}.cv-10{background:linear-gradient(160deg,#28100a,#8f401e)}.cv-11{background:linear-gradient(160deg,#0a2818,#1e7a4a)}.cv-12{background:linear-gradient(160deg,#200a28,#6a1e8f)}
</style>
<link rel="icon" type="image/png" href="./logo-icon.png"/>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-top">
    <a href="griotte-dashboard.html" class="back-link">← Retour</a>
    <div class="cat-logo"><div class="g-icon g-icon--40"><img src="./logo-icon.png" alt="GRIOTTE" onerror="this.style.display='none'"></div></div>
      </span>
    </div>
  </div>

  <div class="filter-block">
    <div class="filter-title">Genre <span class="filter-clear" onclick="clearGenre()">Effacer</span></div>
    <div class="genre-chips" id="genreChips">
      <span class="chip active" onclick="setGenre('',this)">Tout</span>
      <span class="chip" onclick="setGenre('roman',this)">Roman</span>
      <span class="chip" onclick="setGenre('romance',this)">Romance</span>
      <span class="chip" onclick="setGenre('fantastique',this)">Fantastique</span>
      <span class="chip" onclick="setGenre('histoire',this)">Histoire</span>
      <span class="chip" onclick="setGenre('policier',this)">Policier</span>
      <span class="chip" onclick="setGenre('thriller',this)">Thriller</span>
      <span class="chip" onclick="setGenre('jeunesse',this)">Jeunesse</span>
      <span class="chip" onclick="setGenre('poésie',this)">Poésie</span>
    </div>
  </div>

  <div class="filter-block">
    <div class="filter-title">Trier par</div>
    <select class="sort-select" id="sortSelect" onchange="applyFilters()">
      <option value="recent">Plus récents</option>
      <option value="alpha">Alphabétique</option>
      <option value="pages_asc">Moins de pages</option>
      <option value="pages_desc">Plus de pages</option>
    </select>
  </div>

  <div class="filter-block">
    <div class="filter-title">Pays</div>
    <div class="country-list" id="countryList">
      <div class="country-item active" onclick="setCountry('',this)">🌍 Tous les pays</div>
    </div>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h1 class="cat-title">Catalogue</h1>
      <span class="results-count" id="resultsCount">Chargement...</span>
    </div>
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Titre, auteur, tag..." oninput="applyFilters()"/>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" id="btnGrid" onclick="setView('grid',this)" title="Grille">⊞</button>
      <button class="view-btn" id="btnList" onclick="setView('list',this)" title="Liste">☰</button>
    </div>
  </div>

  <div class="content">
    <div id="booksGrid" class="books-grid">
      <div class="loading-state" style="grid-column:1/-1">
        <span class="loading-ico">⏳</span>
        <div class="loading-text">Chargement des œuvres...</div>
      </div>
    </div>
    <button class="load-more-btn" id="loadMoreBtn" style="display:none" onclick="loadMore()">Charger plus →</button>
  </div>
</div>

<script>
(function(){
const API='https://griotte-backend-2-production.up.railway.app/api/v1/auth';
const covers=['cv-1','cv-2','cv-3','cv-4','cv-5','cv-6','cv-7','cv-8','cv-9','cv-10','cv-11','cv-12'];
let allBooks=[];
let filtered=[];
let displayCount=18;
let currentView='grid';
let activeGenre='';
let activeCountry='';

// Load books from backend
async function loadBooks(){
  try{
    const res=await fetch(API+'/books-public');
    const data=await res.json();
    if(!data||!Array.isArray(data)||data.length===0){
      showEmpty();
      return;
    }
    allBooks=data;
    buildCountryList();
    applyFilters();
  }catch(e){
    document.getElementById('booksGrid').innerHTML='<div class="empty-state" style="grid-column:1/-1"><span class="empty-ico">⚠️</span><div class="empty-title">Erreur de connexion</div><div class="empty-sub">Impossible de charger les œuvres.<br/>Vérifiez votre connexion.</div></div>';
  }
}

function buildCountryList(){
  const countries={};
  allBooks.forEach(function(b){
    if(b.author&&b.author.country) countries[b.author.country]=(countries[b.author.country]||0)+1;
  });
  const cl=document.getElementById('countryList');
  let html='<div class="country-item active" onclick="setCountry(\'\',this)">🌍 Tous les pays <span class="country-count">'+allBooks.length+'</span></div>';
  Object.entries(countries).forEach(function(e){
    html+='<div class="country-item" onclick="setCountry(\''+e[0]+'\',this)">'+e[0]+' <span class="country-count">'+e[1]+'</span></div>';
  });
  cl.innerHTML=html;
}

function applyFilters(){
  const search=(document.getElementById('searchInput').value||'').toLowerCase();
  const sort=document.getElementById('sortSelect').value;
  filtered=allBooks.filter(function(b){
    const matchGenre=!activeGenre||b.genre.toLowerCase().includes(activeGenre);
    const matchCountry=!activeCountry||JSON.stringify(b).toLowerCase().includes(activeCountry.toLowerCase());
    const matchSearch=!search||
      b.title.toLowerCase().includes(search)||
      (b.author&&b.author.name&&b.author.name.toLowerCase().includes(search))||
      (b.synopsis&&b.synopsis.toLowerCase().includes(search))||
      (b.tags&&b.tags.join(' ').toLowerCase().includes(search));
    return matchGenre&&matchCountry&&matchSearch;
  });
  if(sort==='alpha') filtered.sort(function(a,b){return a.title.localeCompare(b.title);});
  else if(sort==='pages_asc') filtered.sort(function(a,b){return a.totalPages-b.totalPages;});
  else if(sort==='pages_desc') filtered.sort(function(a,b){return b.totalPages-a.totalPages;});
  else filtered.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
  displayCount=18;
  render();
}

function render(){
  const grid=document.getElementById('booksGrid');
  const rc=document.getElementById('resultsCount');
  const lmb=document.getElementById('loadMoreBtn');
  const shown=filtered.slice(0,displayCount);
  rc.textContent=filtered.length+' œuvre'+(filtered.length>1?'s':'');
  if(filtered.length===0){showEmpty();lmb.style.display='none';return;}
  lmb.style.display=displayCount<filtered.length?'block':'none';
  if(currentView==='grid'){
    grid.className='books-grid';
    grid.innerHTML=shown.map(function(b,i){return gridCard(b,i);}).join('');
  } else {
    grid.className='books-grid list-view';
    grid.innerHTML=shown.map(function(b,i){return listCard(b,i);}).join('');
  }
}

function gridCard(b,i){
  const url='griotte-reader.html?bookId='+encodeURIComponent(b.id);
  const tags=(b.tags||[]).slice(0,2);
  let coverHtml='';
  if(b.coverImage){
    coverHtml='<img src="'+b.coverImage+'" alt="'+b.title+'" style="width:100%;height:100%;object-fit:cover"/>';
  } else {
    coverHtml='<div class="book-cover-placeholder '+covers[i%12]+'"></div>';
  }
  return '<div class="book-card" onclick="window.location.href=\''+url+'\'">'
    +'<div class="book-cover">'
    +coverHtml
    +'<div class="book-pages-cover">'+b.totalPages+' p.</div>'
    +'<div class="book-overlay"><button class="book-overlay-btn">▶ Lire</button></div>'
    +'</div>'
    +'<div class="book-title-cat">'+b.title+'</div>'
    +'<div class="book-author-cat">'+(b.author?b.author.name:'—')+'</div>'
    +'<div class="book-meta-row"><span class="book-rating-cat">★ 4.8</span><span class="book-price">'+b.genre+'</span></div>'
    +'</div>';
}

function listCard(b,i){
  const url='griotte-reader.html?bookId='+encodeURIComponent(b.id);
  const tags=(b.tags||[]).slice(0,3);
  let coverHtml='';
  if(b.coverImage){
    coverHtml='<img src="'+b.coverImage+'" alt="'+b.title+'" style="width:100%;height:100%;object-fit:cover"/>';
  } else {
    coverHtml='<div class="list-cover-ph '+covers[i%12]+'"></div>';
  }
  return '<div class="book-card-list" onclick="window.location.href=\''+url+'\'">'
    +'<div class="list-cover">'+coverHtml+'</div>'
    +'<div class="list-info">'
    +'<div class="list-title">'+b.title+'</div>'
    +'<div class="list-author">'+(b.author?b.author.name:'—')+' · '+b.genre+'</div>'
    +'<div class="list-synopsis">'+(b.synopsis||'Aucun synopsis disponible.')+'</div>'
    +'<div class="list-tags">'+tags.map(function(t){return '<span class="list-tag">'+t+'</span>';}).join('')+'</div>'
    +'</div>'
    +'<div class="list-right">'
    +'<div class="list-rating">★ 4.8</div>'
    +'<div class="list-pages">'+b.totalPages+' pages</div>'
    +'<button class="list-read-btn" onclick="event.stopPropagation();window.location.href=\''+url+'\'">▶ Lire</button>'
    +'</div>'
    +'</div>';
}

function showEmpty(){
  const grid=document.getElementById('booksGrid');
  const cls=currentView==='grid'?'books-grid':'books-grid list-view';
  grid.className=cls;
  grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><span class="empty-ico">🔍</span><div class="empty-title">Aucun résultat</div><div class="empty-sub">Aucune œuvre ne correspond à vos filtres.</div></div>';
}

window.setGenre=function(genre,el){
  activeGenre=genre;
  document.querySelectorAll('.genre-chips .chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  applyFilters();
};
window.clearGenre=function(){
  activeGenre='';
  document.querySelectorAll('.genre-chips .chip').forEach(function(c){c.classList.remove('active');});
  document.querySelector('.genre-chips .chip').classList.add('active');
  applyFilters();
};
window.setCountry=function(country,el){
  activeCountry=country;
  document.querySelectorAll('.country-item').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  applyFilters();
};
window.setView=function(view,btn){
  currentView=view;
  document.querySelectorAll('.view-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  render();
};
window.loadMore=function(){displayCount+=18;render();};

loadBooks();
})();
</script>
</body>
</html>
